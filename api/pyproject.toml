[project]
name = "greenvolt-api"
version = "0.1.0"
description = "GreenVolt Electronics API (FastAPI + SQLModel)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
# B008: FastAPI dependencies are intentionally called in argument defaults.
# B009: dynamic column access via getattr() is required for SQLModel models.
ignore = ["B008", "B009"]

[tool.ruff.lint.per-file-ignores]
# Seed content contains long, intentional prose strings.
"app/seed.py" = ["E501"]
# Autogenerated migration files are not hand-formatted.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
